<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
</head>

<body>

<h1>Student Management System</h1>

<a href="/add">Add Student</a>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>Action</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student[0] }}</td>
        <td>{{ student[1] }}</td>
        <td>{{ student[2] }}</td>
        <td>
            <a href="/delete/{{ student[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
